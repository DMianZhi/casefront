<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; font: 13px/1.6 system-ui, sans-serif; margin: 10px; }
    .row { margin: 8px 0; }
    button { padding: 6px 14px; cursor: pointer; }
    #mode { margin-right: 6px; }
    #status { white-space: pre-wrap; }
    .hint { color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h3>casefront</h3>
  <div class="row">
    <select id="mode">
      <option value="compact" selected>精简（同类折叠）</option>
      <option value="full">完整（全量）</option>
    </select>
    <button id="scan">扫描此页</button>
  </div>
  <div id="status" class="row">就绪</div>
  <div class="hint">精简模式会将 5 个以上同名/同尾类元素折叠为一组；完整模式全量导出。</div>
</body>
</html>
